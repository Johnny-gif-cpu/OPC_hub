# ============================================================
# Pandora X — Nginx 反向代理配置
# 适用：Ubuntu/Debian，腾讯云轻量服务器
#
# 部署步骤：
#   1. 上传到 /etc/nginx/sites-available/pandora
#   2. sudo ln -s /etc/nginx/sites-available/pandora /etc/nginx/sites-enabled/
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. 运行 certbot 获取 SSL 证书：
#      sudo certbot --nginx -d api.rwaindex.cn
#
# ⚠️ 替换 api.rwaindex.cn 为你的实际 API 子域名
# ============================================================

server {
    listen 80;
    server_name api.rwaindex.cn;

    # 后端 API 反代 → Node.js
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 健康检查不需要日志
    location /health {
        proxy_pass http://127.0.0.1:4000;
        access_log off;
    }
}
